name: macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            macho: arm64
          - arch: amd64
            runner: macos-15-intel
            macho: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: go mod tidy -diff
      - run: go mod verify
      - run: make check
      - run: make race
      - run: make build ARCH="$BUILD_ARCH"
        env:
          BUILD_ARCH: ${{ matrix.arch }}
      - name: Verify packaged architecture and version
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          MACHO_ARCH: ${{ matrix.macho }}
        run: |
          app="build/darwin-$BUILD_ARCH/Mory.app"
          test "$(lipo -archs "$app/Contents/MacOS/Mory")" = "$MACHO_ARCH"
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          codesign --verify --deep --strict "$app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mory-macOS-${{ matrix.arch }}
          path: |
            build/darwin-${{ matrix.arch }}/*.dmg
            build/darwin-${{ matrix.arch }}/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Mory-macOS-*
          path: artifacts
      - name: Assemble verified release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path

          version = json.loads(Path("mygo.json").read_text())["version"]
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v" + re.escape(version) + r"(?:-(?:alpha|beta|rc)\.\d+)?", tag):
              raise SystemExit("Release tag does not match the application version")
          output = Path("release-assets")
          output.mkdir()
          checksums = []
          for arch in ("arm64", "amd64"):
              folder = Path("artifacts") / f"Mory-macOS-{arch}"
              source = folder / f"mory-{version}-{arch}.dmg"
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              if (folder / "SHA256SUMS").read_text().split() != [digest, source.name]:
                  raise SystemExit(f"Checksum mismatch: {arch}")
              target = output / f"mory-{tag[1:]}-macos-{arch}.dmg"
              shutil.copyfile(source, target)
              checksums.append(f"{digest}  {target.name}\n")
          (output / "SHA256SUMS").write_text("".join(checksums))
          PY
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --draft "${flags[@]}" \
            --title "Mory ${RELEASE_TAG#v}" \
            --notes-file .github/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
