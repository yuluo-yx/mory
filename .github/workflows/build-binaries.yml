name: Build Desktop Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: mory-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Install dependencies
        run: make install
      - name: Validate and package
        run: make ci-macos
      - name: Archive application bundle
        run: tar -czf "dist/Mory-macos-${{ matrix.arch }}.tar.gz" -C dist/macos Mory.app
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mory-macos-${{ matrix.arch }}
          path: dist/Mory-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 and ARM64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Install GNU Make
        shell: powershell
        run: choco install make --yes --no-progress
      - name: Install dependencies
        run: make install
      - name: Validate and package
        run: make ci-windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mory-windows-x64-arm64
          path: dist/windows/*.exe
          if-no-files-found: error
          retention-days: 14
