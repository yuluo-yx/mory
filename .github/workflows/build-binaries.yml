name: Build and Release Desktop Apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag matching package.json, for example v0.1.0"
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: mory-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Install dependencies
        run: make install
      - name: Validate and package
        run: make ci-macos
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mory-macos-${{ matrix.arch }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 and ARM64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Install GNU Make
        shell: powershell
        run: choco install make --yes --no-progress
      - name: Install dependencies
        run: make install
      - name: Validate and package
        run: make ci-windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mory-windows-x64-arm64
          path: dist/windows/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs:
      - macos
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Mory-*
          path: release-assets
          merge-multiple: true
      - name: Validate release version and assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $expected_tag." >&2
            exit 1
          fi

          required_assets=(
            "Mory-${package_version}-macos-arm64.dmg"
            "Mory-${package_version}-macos-arm64.zip"
            "Mory-${package_version}-macos-x64.dmg"
            "Mory-${package_version}-macos-x64.zip"
            "Mory-Setup-${package_version}-x64.exe"
            "Mory-Portable-${package_version}-x64.exe"
            "Mory-Setup-${package_version}-arm64.exe"
            "Mory-Portable-${package_version}-arm64.exe"
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -f "release-assets/$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum Mory-* > "Mory-${package_version}-SHA256SUMS.txt"
          )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Mory ${package_version}" \
            --generate-notes \
            --latest
